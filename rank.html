<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#2B438E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>ขยะแลกแต้ม — Rank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/build/student.css">
</head>
<body data-role="student">
<div class="app-shell app-shell--home page-rank">
<div class="bg-blob bg-blob--1"></div>
<div class="bg-blob bg-blob--2 dash-corner-glow"></div>
<div class="bg-blob bg-blob--3"></div>
<div class="hero-glow" aria-hidden="true">
  <div class="hero-glow-navy"></div>
  <div class="hero-glow-yellow"></div>
</div>
<div class="dash-scroll">

  <!-- header (dash-header--home: text floats on the gradient, same as
       Home/Shop/Scan, instead of sitting in its own white card) -->
  <div class="dash-header dash-header--home">
    <div class="header-row" style="justify-content:flex-start;">
      <div class="header-name-block">
        <div class="student-name hero-title">Hall of Fame</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <div class="section-heading lg" style="padding-left:0;margin-bottom:2px;">
        <span class="title">Top 10</span>
        <button type="button" class="info-btn" id="rank-info-btn" aria-label="อันดับนับยังไง" aria-expanded="false" aria-controls="rank-help">i</button>
      </div>
      <div class="ticket-help" id="rank-help" hidden>
        <div class="q">อันดับนับยังไง?</div>
        <div class="a">นับจากแต้มทั้งหมดที่ได้จากการส่งขยะ (เฉพาะที่แอดมินอนุมัติแล้ว)</div>
        <div class="q">แลกของแล้วอันดับจะลดไหม?</div>
        <div class="a">ไม่ลด แต้มที่ใช้แลกของไม่ถูกหักจากอันดับ แลกได้เต็มที่</div>
      </div>

      <div class="rank-podium" id="rank-podium"></div>
      <div class="rank-list" id="rank-list"></div>
      <div class="rank-own" id="rank-own" hidden></div>
    </div>
  </div>

</div>

<div class="bottom-nav-wrap">
  <nav class="bottom-nav" aria-label="เมนูหลัก">
    <a href="dashboard.html" class="side-brand">
      <span class="side-brand-mark" aria-hidden="true">♻</span>
      <span class="side-brand-text">ขยะแลกแต้ม</span>
    </a>
    <div class="side-user">
      <div class="polaroid side-polaroid" aria-hidden="true"><div class="photo" id="side-initial"></div></div>
      <div class="side-user-text">
        <div class="side-name" id="side-name"></div>
        <div class="side-points"><span id="side-points">0</span> pts</div>
      </div>
    </div>
    <div class="side-divider" aria-hidden="true"></div>
    <a href="dashboard.html" class="nav-item" data-tab="home">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12 12 4l8 8v7a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">home</span>
    </a>
    <a href="shop.html" class="nav-item" data-tab="shop">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 9h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 9zM9 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">shop</span>
    </a>
    <a href="scan.html" class="nav-item nav-item--fab" data-tab="scan" aria-label="Scan">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">scan</span>
    </a>
    <a href="rank.html" class="nav-item active" aria-current="page" data-tab="rank">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0V4zM5 5H3a3 3 0 0 0 3 5M19 5h2a3 3 0 0 1-3 5M10 14h4v3h2v3H8v-3h2v-3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">rank</span>
    </a>
    <a href="me.html" class="nav-item" data-tab="me">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">me</span>
    </a>
  </nav>
</div>

<div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/session-guard.js"></script>
<script src="js/nav-common.js"></script>
<script src="js/rank.js"></script>
</body>
</html>
