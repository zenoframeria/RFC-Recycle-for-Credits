<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#1E3A8A"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>ขยะแลกแต้ม — เข้าสู่ระบบนักเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/build/login.css">
</head>
<body data-role="student">
<div class="app-shell">
<div class="bg-blob bg-blob--1"></div>
<div class="bg-blob bg-blob--2"></div>
<div class="bg-blob bg-blob--3"></div>

  <div class="login-content">

    <div class="logo-block">
      <div class="logo-wrap">
        <div class="logo-glow"></div>
        <div class="logo-ring"></div>
        <div class="logo-body">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--sb-yellow)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg>
        </div>
      </div>

      <div class="tagline-script">welcome ★</div>
      <div class="login-title">Ready to Recycle?</div>

      <div class="chip">
        <span class="dot"></span>
        STUDENT ACCESS
      </div>
    </div>

    <div class="login-ticket">
    <div class="card" id="login-card">

      <div class="card-heading">
        <span class="line"></span>
        <span class="label">◆ MISSION ACCESS ◆</span>
        <span class="line"></span>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">เข้าสู่ระบบ<span class="tab-sub">· Login</span></button>
        <button type="button" class="auth-tab" data-mode="signup">สมัครสมาชิก<span class="tab-sub">· Sign up</span></button>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label class="field-label" for="field-id">
            <span class="name">Student ID</span>
            <span class="sub">· รหัสนักเรียน</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="text" id="field-id" placeholder="0XXXXX" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="field-password">
            <span class="name">Password</span>
            <span class="sub">· รหัสผ่าน</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM12 14v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="password" id="field-password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-btn" id="toggle-password" aria-label="Show password">
              <svg width="16" height="16" viewBox="0 0 24 24"><path id="eye-path" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <div class="check-row">
          <button type="button" class="forgot-link">ลืมรหัส?</button>
        </div>

        <div class="login-error" id="login-error" hidden>รหัสนักเรียนหรือรหัสผ่านไม่ถูกต้อง</div>

        <button type="submit" class="btn-primary" style="margin-top:18px;">
          <div class="glow"></div>
          <div class="body">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M14 4c4 0 6 2 6 6 0 2-1 4-3 5l-3 1-3-3 1-3c1-2 3-3 5-3M9 15l-2 5 5-2M5 13l6-6" fill="none" stroke="var(--sb-yellow)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="label">LET'S RECYCLE</span>
          </div>
        </button>
      </form>

      <form id="signup-form" novalidate hidden>
        <div class="field">
          <label class="field-label" for="signup-id">
            <span class="name">Student ID</span>
            <span class="sub">· รหัสนักเรียน</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="text" id="signup-id" placeholder="0XXXXX" autocomplete="username" required>
          </div>
        </div>

        <div style="font-family:var(--font-thai);font-size:11.5px;color:rgba(26,31,51,0.55);margin-top:6px;line-height:1.4;">
          ระบบจะตรวจสอบชื่อนักเรียนผ่านรหัสนักเรียนในรายชื่อให้อัตโนมัติ
        </div>

        <div class="field">
          <label class="field-label" for="signup-password">
            <span class="name">Password</span>
            <span class="sub">· อย่างน้อย 6 ตัวอักษร</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM12 14v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="password" id="signup-password" placeholder="••••••••" autocomplete="new-password" required minlength="6">
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="signup-password-confirm">
            <span class="name">Confirm</span>
            <span class="sub">· ยืนยันรหัสผ่าน</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 10V8a6 6 0 0 1 12 0v2M5 10h14v10a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1zM12 14v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input type="password" id="signup-password-confirm" placeholder="••••••••" autocomplete="new-password" required>
          </div>
        </div>

        <div class="login-error" id="signup-error" hidden></div>

        <button type="submit" class="btn-primary" style="margin-top:18px;">
          <div class="glow"></div>
          <div class="body">
            <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21a7 7 0 0 1 12-5M17 8v6M14 11h6" fill="none" stroke="var(--sb-yellow)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="label">CREATE ACCOUNT</span>
          </div>
        </button>
      </form>
    </div>
      <div class="login-ticket-tape" aria-hidden="true"></div>
    </div>

    <div class="switch-role">
      เป็นแอดมิน? <a href="login-admin.html">login as admin</a>
    </div>

    <div class="login-spacer"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
