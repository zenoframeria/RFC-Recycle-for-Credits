<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#F5EFDB"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>ขยะแลกแต้ม — เข้าสู่ระบบนักเรียน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/build/login.css">
</head>
<body data-role="student">
<div class="app-shell">
<div class="bg-blob bg-blob--1"></div>
<div class="bg-blob bg-blob--2"></div>
<div class="bg-blob bg-blob--3"></div>

  <div class="login-content">

    <div class="logo-block">
      <div class="logo-wrap">
        <div class="logo-body">
          <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--sb-yellow)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/><path d="M11 19h8.203a1.83 1.83 0 0 0 1.556-.89 1.784 1.784 0 0 0 0-1.775l-1.226-2.12"/><path d="m14 16-3 3 3 3"/><path d="M8.293 13.596 7.196 9.5 3.1 10.598"/><path d="m9.344 5.811 1.093-1.892A1.83 1.83 0 0 1 11.985 3a1.784 1.784 0 0 1 1.546.888l3.943 6.843"/><path d="m13.378 9.633 4.096 1.098 1.097-4.096"/></svg>
        </div>
      </div>

      <div class="tagline-script">welcome ★</div>
      <div class="login-title">Ready to Recycle?</div>

      <div class="chip">
        <span class="dot"></span>
        STUDENT ACCESS
      </div>
    </div>

    <div class="login-ticket">
    <div class="card" id="login-card">

      <div class="card-heading">
        <span class="line"></span>
        <span class="label">◆ MISSION ACCESS ◆</span>
        <span class="line"></span>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab active" data-mode="login">เข้าสู่ระบบ<span class="tab-sub">· Login</span></button>
        <button type="button" class="auth-tab" data-mode="signup">สมัครสมาชิก<span class="tab-sub">· Sign up</span></button>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label class="field-label" for="field-id">
            <span class="name">Student ID</span>
            <span class="sub">· รหัสนักเรียน</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
            <input type="text" id="field-id" placeholder="0XXXX" autocomplete="username" required>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="field-password">
            <span class="name">Password</span>
            <span class="sub">· รหัสผ่าน</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
            <input type="password" id="field-password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="toggle-btn" id="toggle-password" aria-label="Show password">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" /><circle cx="12" cy="12" r="3" /></svg>
            </button>
          </div>
        </div>

        <div class="check-row">
          <button type="button" class="forgot-link">ลืมรหัส?</button>
        </div>

        <div class="captcha-slot" id="login-captcha"></div>

        <div class="login-error" id="login-error" hidden>รหัสนักเรียนหรือรหัสผ่านไม่ถูกต้อง</div>

        <button type="submit" class="btn-primary" style="margin-top:18px;">
          <div class="body">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--sb-yellow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" /><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" /><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" /><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" /></svg>
            <span class="label">LET'S RECYCLE</span>
          </div>
        </button>
      </form>

      <form id="signup-form" novalidate hidden>
        <div class="field">
          <label class="field-label" for="signup-id">
            <span class="name">Student ID</span>
            <span class="sub">· รหัสนักเรียน</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></svg>
            <input type="text" id="signup-id" placeholder="0XXXX" autocomplete="username" required>
          </div>
        </div>

        <div style="font-family:var(--font-thai);font-size:11.5px;color:rgba(26,31,51,0.55);margin-top:6px;line-height:1.4;">
          ระบบจะตรวจสอบชื่อนักเรียนผ่านรหัสนักเรียนในรายชื่อให้อัตโนมัติ
        </div>

        <div class="field">
          <label class="field-label" for="signup-password">
            <span class="name">Password</span>
            <span class="sub">· อย่างน้อย 6 ตัวอักษร</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
            <input type="password" id="signup-password" placeholder="••••••••" autocomplete="new-password" required minlength="6">
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="signup-password-confirm">
            <span class="name">Confirm</span>
            <span class="sub">· ยืนยันรหัสผ่าน</span>
          </label>
          <div class="field-box">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></svg>
            <input type="password" id="signup-password-confirm" placeholder="••••••••" autocomplete="new-password" required>
          </div>
        </div>

        <div class="captcha-slot" id="signup-captcha"></div>

        <div class="login-error" id="signup-error" hidden></div>

        <button type="submit" class="btn-primary" style="margin-top:18px;">
          <div class="body">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--sb-yellow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><line x1="19" x2="19" y1="8" y2="14" /><line x1="22" x2="16" y1="11" y2="11" /></svg>
            <span class="label">CREATE ACCOUNT</span>
          </div>
        </button>
      </form>
    </div>
      <div class="login-ticket-tape" aria-hidden="true"></div>
    </div>

    <div class="switch-role">
      เป็นแอดมิน? <a href="login-admin.html">login as admin</a>
    </div>

    <div class="login-spacer"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/auth.js"></script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad" async defer></script>
</body>
</html>
