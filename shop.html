<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#2B438E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>ขยะแลกแต้ม — Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/build/student.css">
</head>
<body data-role="student">
<div class="app-shell app-shell--home page-shop">
<div class="bg-blob bg-blob--1"></div>
<div class="bg-blob bg-blob--2 dash-corner-glow"></div>
<div class="bg-blob bg-blob--3"></div>
<div class="hero-glow" aria-hidden="true">
  <div class="hero-glow-navy"></div>
  <div class="hero-glow-yellow"></div>
</div>
<div class="dash-scroll">

  <!-- header (dash-header--home: text floats on the gradient, same as
       Home's header, instead of sitting in its own white card) -->
  <div class="dash-header dash-header--home">
    <div class="header-row" style="justify-content:space-between;">
      <div class="header-name-block">
        <div class="student-name hero-title">แลกของรางวัล</div>
      </div>
      <div class="balance-chip">
        <span class="k">your balance</span>
        <span class="v"><span id="shop-points">0</span> <span class="unit">pts</span></span>
      </div>
    </div>
  </div>

  <!-- certificate CTA -->
  <div class="section">
    <div class="section-heading">
      <span class="icon"><svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 3l2.4 5.5 6 .5-4.5 4 1.4 6-5.3-3.2L6.7 19l1.4-6L3.6 9l6-.5z" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span class="title">Featured</span>
      <span class="sub">· ของรางวัลแนะนำ</span>
    </div>
    <div id="shop-cert"></div>
  </div>

  <!-- stationery -->
  <div class="section">
    <div class="card">
      <div class="tape tape--stripe" style="width:66px;height:16px;background:var(--accent);transform:rotate(-7deg);left:-14px;top:-8px;opacity:0.9;"></div>
      <div class="tape tape--dots" style="width:42px;height:14px;background:var(--sb-yellow-soft);transform:rotate(12deg);right:-8px;top:-6px;"></div>
      <div class="section-heading lg" style="padding-left:0;margin-bottom:2px;">
        <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M4 20h4l11-11-4-4L4 16v4zM14.5 6.5l3 3" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="title">Stationery</span>
        <span class="sub">· เครื่องเขียนสะสม</span>
      </div>
      <div class="shop-section-note">แลกได้ตลอด · ไม่จำกัดจำนวน</div>
      <div class="stationery-grid" id="shop-stationery"></div>
    </div>
  </div>

  <!-- limited edition -->
  <div class="section">
    <div class="limited-section">
      <div class="limited-badge">เปิดแลกเฉพาะช่วง · 1–15 ก.ย.</div>
      <div class="section-heading lg" style="padding-left:0;margin-bottom:2px;">
        <span class="icon"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6z" fill="none" stroke="var(--sb-red)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        <span class="title">Limited Edition</span>
      </div>
      <div class="shop-section-note">ของรางวัลจำกัดจำนวน · ของจริง สต๊อกจำกัดต่อรอบ หมดแล้วรอรอบถัดไป</div>
      <div id="shop-limited"></div>
    </div>
  </div>

</div>

<div class="bottom-nav-wrap">
  <nav class="bottom-nav" aria-label="เมนูหลัก">
    <a href="dashboard.html" class="side-brand">
      <span class="side-brand-mark" aria-hidden="true">♻</span>
      <span class="side-brand-text">ขยะแลกแต้ม</span>
    </a>
    <div class="side-user">
      <div class="polaroid side-polaroid" aria-hidden="true"><div class="photo" id="side-initial"></div></div>
      <div class="side-user-text">
        <div class="side-name" id="side-name"></div>
        <div class="side-points"><span id="side-points">0</span> pts</div>
      </div>
    </div>
    <div class="side-divider" aria-hidden="true"></div>
    <a href="dashboard.html" class="nav-item" data-tab="home">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12 12 4l8 8v7a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">home</span>
    </a>
    <a href="shop.html" class="nav-item active" aria-current="page" data-tab="shop">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 9h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 9zM9 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">shop</span>
    </a>
    <a href="scan.html" class="nav-item nav-item--fab" data-tab="scan" aria-label="Scan">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">scan</span>
    </a>
    <a href="rank.html" class="nav-item" data-tab="rank">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0V4zM5 5H3a3 3 0 0 0 3 5M19 5h2a3 3 0 0 1-3 5M10 14h4v3h2v3H8v-3h2v-3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">rank</span>
    </a>
    <a href="me.html" class="nav-item" data-tab="me">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">me</span>
    </a>
  </nav>
</div>

<div class="modal-overlay" id="item-detail">
  <div class="modal-card modal-card--photo item-detail-card">
    <button class="modal-close" id="item-detail-close" aria-label="ปิด">×</button>
    <img class="lightbox-img item-detail-img" id="item-detail-img" alt="" hidden>
    <div class="item-detail-name" id="item-detail-name"></div>
    <div class="item-detail-cost" id="item-detail-cost"></div>
    <div class="item-detail-desc" id="item-detail-desc" hidden></div>
  </div>
</div>

<div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/session-guard.js"></script>
<script src="js/nav-common.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
