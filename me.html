<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#2B438E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>ขยะแลกแต้ม — Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/build/student.css">
</head>
<body data-role="student">
<div class="app-shell app-shell--home">
<div class="bg-blob bg-blob--1"></div>
<div class="bg-blob bg-blob--2 dash-corner-glow"></div>
<div class="bg-blob bg-blob--3"></div>
<div class="hero-glow" aria-hidden="true">
  <div class="hero-glow-navy"></div>
  <div class="hero-glow-yellow"></div>
</div>
<div class="dash-scroll">

  <!-- header (dash-header--home: text floats on the gradient, same as
       Home/Shop/Scan/Rank, instead of sitting in its own white card) -->
  <div class="dash-header dash-header--home">
    <span class="header-sparkle" aria-hidden="true" style="top:6px;right:18px;font-size:13px;color:rgba(242,200,75,0.5);">✦</span>
    <span class="header-sparkle" aria-hidden="true" style="top:11px;right:38px;font-size:8px;color:rgba(26,31,51,0.28);">★</span>
    <div class="header-row" style="justify-content:flex-start;">
      <div class="header-name-block">
        <div class="hello-script hero-tagline">that's you~</div>
        <div class="student-name hero-title">โปรไฟล์ของฉัน</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <div class="tape tape--stripe" style="width:66px;height:16px;background:var(--accent);transform:rotate(-7deg);left:-14px;top:-8px;opacity:0.9;"></div>
      <div class="tape tape--dots" style="width:42px;height:14px;background:var(--sb-yellow-soft);transform:rotate(12deg);right:-8px;top:-6px;"></div>
      <div class="section-heading lg" style="padding-left:0;margin-bottom:2px;">
        <span class="title">Me</span>
        <span class="sub">· ข้อมูลบัญชี</span>
      </div>

      <div class="me-info">
        <div class="me-info-row"><span class="k">ชื่อ</span><span class="v" id="me-name">-</span></div>
        <div class="me-info-row"><span class="k">รหัสนักเรียน</span><span class="v" id="me-id">-</span></div>
        <div class="me-info-row"><span class="k">ห้อง</span><span class="v" id="me-classroom">-</span></div>
        <div class="me-info-row"><span class="k">แต้มสะสม</span><span class="v" id="me-points">-</span></div>
      </div>

      <button class="btn-primary" id="logout-btn" style="margin-top:16px;">
        <div class="glow"></div>
        <div class="body">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9" fill="none" stroke="var(--sb-yellow)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="label">LOG OUT</span>
        </div>
      </button>
    </div>
  </div>

</div>

<div class="bottom-nav-wrap">
  <div class="bottom-nav">
    <a href="dashboard.html" class="nav-item" data-tab="home">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12 12 4l8 8v7a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">home</span>
    </a>
    <a href="shop.html" class="nav-item" data-tab="shop">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 9h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 9zM9 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">shop</span>
    </a>
    <a href="scan.html" class="nav-item nav-item--fab" data-tab="scan" aria-label="Scan">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a href="rank.html" class="nav-item" data-tab="rank">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0V4zM5 5H3a3 3 0 0 0 3 5M19 5h2a3 3 0 0 1-3 5M10 14h4v3h2v3H8v-3h2v-3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">rank</span>
    </a>
    <a href="me.html" class="nav-item active" data-tab="me">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">me</span>
    </a>
  </div>
</div>

<div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/session-guard.js"></script>
<script src="js/nav-common.js"></script>
<script src="js/me.js"></script>
</body>
</html>
