<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#F5EFDB"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>ขยะแลกแต้ม — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/build/admin.css">
</head>
<body data-role="admin">
<div class="app-shell">
<div class="dash-scroll">

  <aside class="admin-side" aria-label="เมนูผู้ดูแล">
    <div class="admin-header">
      <div>
        <div class="hello-script">admin control ★</div>
        <div class="admin-name" id="admin-name">-</div>
      </div>
      <button class="icon-btn admin-logout-btn" id="logout-btn" aria-label="Log out" title="Log out">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><polyline points="16 17 21 12 16 7" /><line x1="21" x2="9" y1="12" y2="12" /></svg>
      </button>
    </div>

    <div class="admin-tabs">
      <button type="button" class="admin-tab active" data-panel="feed-panel">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1" ry="1" /><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" /><path d="m9 14 2 2 4-4" /></svg>
        <span class="label">Review</span>
      </button>
      <button type="button" class="admin-tab" data-panel="price-panel">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z" /><circle cx="7.5" cy="7.5" r=".5" fill="currentColor" /></svg>
        <span class="label">Prices</span>
      </button>
      <button type="button" class="admin-tab" data-panel="shop-panel">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7" /><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" /><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4" /><path d="M2 7h20" /><path d="M22 7v3a2 2 0 0 1-2 2a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12a2 2 0 0 1-2-2V7" /></svg>
        <span class="label">Shop</span>
      </button>
      <button type="button" class="admin-tab" data-panel="pickup-panel">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 16 2 2 4-4" /><path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l2-1.14" /><path d="m7.5 4.27 9 5.15" /><polyline points="3.29 7 12 12 20.71 7" /><line x1="12" x2="12" y1="22" y2="12" /></svg>
        <span class="label">Pickups</span>
      </button>
    </div>
  </aside>

  <div class="section admin-panel active" id="feed-panel">
    <div class="section-heading lg" style="padding-left:0;margin-bottom:2px;">
      <span class="title">Pending Submissions</span>
      <span class="sub">· รอตรวจ <span id="feed-count">-</span> รายการ</span>
    </div>
    <div class="feed-list" id="feed-list">
      <div class="coming-soon">กำลังโหลดรายการ...</div>
    </div>
  </div>

  <div class="section admin-panel" id="price-panel">
    <div class="card">
      <div class="section-heading lg" style="padding-left:0;margin-bottom:2px;">
        <span class="title">Category Prices</span>
        <span class="sub">· แก้ไขราคาต่อกิโลกรัม</span>
      </div>
      <div class="price-list" id="price-list">
        <div class="coming-soon">กำลังโหลดหมวดขยะ...</div>
      </div>
    </div>
  </div>

  <div class="section admin-panel" id="shop-panel">
    <div class="card">
      <div class="shop-head">
        <div class="section-heading lg" style="padding-left:0;margin-bottom:2px;">
          <span class="title">Shop Catalog</span>
          <span class="sub">· จัดการสินค้าและรูปภาพ</span>
        </div>
        <button type="button" class="btn-secondary" id="shop-add-btn">
          <span class="label">+ เพิ่มสินค้า</span>
        </button>
      </div>
      <div class="shop-manage-list" id="shop-manage-list">
        <div class="coming-soon">กำลังโหลดรายการสินค้า...</div>
      </div>
    </div>
  </div>

  <div class="section admin-panel" id="pickup-panel">
    <div class="card">
      <div class="section-heading lg" style="padding-left:0;margin-bottom:2px;">
        <span class="title">Pickups</span>
        <span class="sub">· ตรวจตั๋วก่อนมอบของ</span>
      </div>
      <form class="pickup-search" id="pickup-search">
        <div class="field-box"><input type="text" id="pickup-code" placeholder="รหัสตั๋ว เช่น R-0042" autocomplete="off" aria-label="รหัสตั๋ว"></div>
        <button type="submit" class="pickup-search-btn">ค้นหา</button>
      </form>
      <div id="pickup-result"></div>

      <!-- what to have ready: pending tickets counted per item, no names on
           purpose — handing over still needs the student's ticket code -->
      <div class="pickup-summary">
        <div class="pickup-summary-head">ของที่รอแจก</div>
        <div id="pickup-summary-list"><div class="coming-soon">กำลังโหลด...</div></div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="lightbox-overlay">
  <div class="modal-card">
    <button class="modal-close" id="lightbox-close">&times;</button>
    <img class="lightbox-img" id="lightbox-img" alt="รูปเต็ม">
  </div>
</div>

<div class="modal-overlay" id="shop-item-modal">
  <div class="modal-card">
    <button class="modal-close" id="shop-item-modal-close">&times;</button>
    <div class="section-heading lg" style="padding-left:0;margin-bottom:10px;">
      <span class="title" id="shop-item-modal-title">เพิ่มสินค้า</span>
    </div>
    <div class="required-note">ช่องที่มี <span class="req">*</span> ต้องกรอก</div>

    <div class="field">
      <label class="field-label" for="shop-item-name"><span class="name">ชื่อสินค้า <span class="req">*</span></span><span class="sub req-sub">จำเป็น</span></label>
      <div class="field-box"><input type="text" id="shop-item-name" placeholder="เช่น ปากกาเจลหมึกสี" aria-required="true" aria-describedby="shop-item-name-error"></div>
      <div class="field-error" id="shop-item-name-error" hidden></div>
    </div>

    <div class="field">
      <label class="field-label" for="shop-item-section"><span class="name">โซน</span></label>
      <div class="field-box">
        <select id="shop-item-section" class="field-select">
          <option value="stationery">เครื่องเขียน (Stationery)</option>
          <option value="cert">เกียรติบัตร (Cert)</option>
          <option value="limited">Limited Edition</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label" for="shop-item-cost"><span class="name">ราคา (แต้ม) <span class="req">*</span></span><span class="sub req-sub">จำเป็น</span></label>
      <div class="field-box"><input type="number" min="0" step="1" id="shop-item-cost" placeholder="เช่น 350" aria-required="true" aria-describedby="shop-item-cost-error"></div>
      <div class="field-error" id="shop-item-cost-error" hidden></div>
    </div>

    <div class="field">
      <label class="field-label" for="shop-item-desc"><span class="name">คำอธิบาย</span><span class="sub">ไม่บังคับ</span></label>
      <div class="field-box"><input type="text" id="shop-item-desc" placeholder=""></div>
    </div>

    <div class="field">
      <label class="field-label" for="shop-item-stock-max"><span class="name">จำนวนทั้งหมด</span><span class="sub">ไม่บังคับ · ใช้เฉพาะ Limited</span></label>
      <div class="field-box"><input type="number" min="0" step="1" id="shop-item-stock-max" placeholder="เช่น 10"></div>
    </div>

    <div class="field" id="shop-item-stock-field" hidden>
      <label class="field-label" for="shop-item-stock"><span class="name">จำนวนคงเหลือ</span><span class="sub">กรณีที่มีคนอยากคืนของหรือว่ากดผิด</span></label>
      <div class="field-box"><input type="number" min="0" step="1" id="shop-item-stock" placeholder="ว่าง = เท่ากับทั้งหมด"></div>
    </div>

    <div class="field">
      <label class="field-label" for="shop-item-opens-on"><span class="name">วันที่เปิดแลก</span><span class="sub">ไม่บังคับ · ใช้เฉพาะ Limited ที่ยังไม่เปิด</span></label>
      <div class="field-box"><input type="date" id="shop-item-opens-on"></div>
    </div>

    <div class="field">
      <input type="file" accept="image/jpeg,image/png" id="shop-item-photo-input" hidden>
      <button type="button" class="btn-secondary" id="shop-item-photo-trigger">
        <span class="label">แนบรูปสินค้า</span>
      </button>
      <div class="photo-preview" id="shop-item-photo-preview" hidden>
        <img id="shop-item-photo-preview-img" alt="ตัวอย่างรูปสินค้า">
      </div>
    </div>

    <div class="field" style="margin-top:14px;">
      <button type="button" class="btn-primary" id="shop-item-save-btn">
        <span class="body"><span class="label" id="shop-item-save-label">บันทึก</span></span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/admin-session-guard.js"></script>
<script src="js/nav-common.js"></script>
<script src="js/admin-shop.js"></script>
<script src="js/admin-pickups.js"></script>
<script src="js/admin-review.js"></script>
</body>
</html>
