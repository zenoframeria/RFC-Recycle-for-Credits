<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0F2461"/>
<title>ขยะแลกแต้ม — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&family=Bai+Jamjuree:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body data-role="student">
<div class="app-shell app-shell--home">
<div class="bg-blob bg-blob--1"></div>
<div class="bg-blob bg-blob--2 dash-corner-glow"></div>
<div class="bg-blob bg-blob--3"></div>
<div class="hero-glow" aria-hidden="true">
  <div class="hero-glow-navy"></div>
  <div class="hero-glow-yellow"></div>
</div>
<div class="dash-scroll">

  <!-- header (top bar removed — notification bell now lives here, top-right) -->
  <div class="dash-header dash-header--home">
    <span class="header-sparkle" aria-hidden="true" style="top:13px;right:20px;font-size:16px;color:rgba(242,200,75,0.55);">✦</span>
    <span class="header-sparkle" aria-hidden="true" style="top:29px;right:38px;font-size:9px;color:rgba(26,31,51,0.3);">★</span>
    <span class="header-sparkle" aria-hidden="true" style="top:9px;right:44px;font-size:11px;color:rgba(242,200,75,0.4);">✦</span>
    <div class="header-row">
      <div class="avatar-wrap">
        <div class="tape tape--stripe" style="width:44px;height:14px;background:var(--sb-yellow-soft);transform:rotate(-12deg);left:-6px;top:-8px;"></div>
        <div class="polaroid">
          <div class="photo" id="avatar-initial">พ</div>
        </div>
      </div>
      <div class="header-name-block">
        <div class="student-name-row" id="student-name-row">
          <div class="student-name" id="student-name">พิมพ์ชนก ว.</div>
          <button class="nickname-edit-btn" id="nickname-edit-btn" aria-label="แก้ไขชื่อเล่น">
            <svg width="13" height="13" viewBox="0 0 24 24"><path d="M4 20h4l11-11-4-4L4 16v4zM14.5 6.5l3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="nickname-edit-row" id="nickname-edit-row" hidden>
          <input type="text" class="nickname-input" id="nickname-input" maxlength="30" placeholder="ชื่อเล่น" autocomplete="off">
          <button class="nickname-save-btn" id="nickname-save-btn" aria-label="บันทึก">
            <svg width="13" height="13" viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="nickname-cancel-btn" id="nickname-cancel-btn" aria-label="ยกเลิก">
            <svg width="13" height="13" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="student-fullname" id="student-fullname">พิมพ์ชนก วงศ์ธนโรจน์</div>
      </div>
      <div class="notif-wrap header-notif">
        <button class="icon-btn" id="notif-btn" aria-haspopup="true" aria-expanded="false" aria-label="Notifications">
          <svg width="17" height="17" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="badge" id="notif-badge"></span>
        </button>
        <div class="notif-panel" id="notif-panel">
          <div class="notif-panel-heading">
            <span class="title">Notifications</span>
            <span class="sub">· การแจ้งเตือน</span>
          </div>
          <div class="notif-list" id="notif-list"></div>
          <button class="history-toggle" id="notif-toggle" hidden>แสดงเพิ่มเติม</button>
        </div>
      </div>
    </div>
  </div>

  <!-- launch pad -->
  <div class="section">
    <div class="section-heading">
      <svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 3l2.4 5.5 6 .5-4.5 4 1.4 6-5.3-3.2L6.7 19l1.4-6L3.6 9l6-.5z" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="title">The Launch Pad</span>
      <span class="sub">· แตะเพื่อสแกนขยะ</span>
    </div>
    <a class="launch-btn" href="scan.html">
      <div class="launch-glow"></div>
      <div class="launch-body">
        <div class="camera-disc">
          <svg width="28" height="28" viewBox="0 0 24 24">
            <path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="var(--sb-ink)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 10.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="none" stroke="var(--sb-ink)" stroke-width="1.6"/>
          </svg>
        </div>
        <div class="launch-text">
          <span class="lets-go">let's go ★</span>
          <div class="headline">Scan &amp; launch</div>
          <div class="sub">ถ่ายรูปขยะของคุณ · รับแต้มทันที</div>
        </div>
        <div class="launch-arrow">
          <svg width="15" height="15" viewBox="0 0 24 24"><path d="M5 12h14m-5-5 5 5-5 5" fill="none" stroke="var(--sb-ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </a>
  </div>

  <!-- personal progress -->
  <div class="section">
    <div class="card progress-card">
      <div class="tape tape--stripe tape--corner-left"></div>
      <div class="tape tape--stripe"></div>
      <div class="progress-card-head">
        <div>
          <div class="section-heading lg" style="margin-bottom:0;padding-left:0;"><span class="title">Personal Progress</span></div>
          <div class="sub" style="font-size:11px;color:rgba(26,31,51,0.6);margin-top:3px;">คะแนนสะสมส่วนตัว</div>
        </div>
      </div>

      <div class="points-ring-wrap">
        <svg class="points-ring" width="200" height="200" viewBox="0 0 200 200">
          <circle class="ring-outline" cx="100" cy="100" r="96"/>
        </svg>
        <div class="points-ring-conic" id="points-ring-conic"></div>
        <div class="points-ring-cap" id="points-ring-cap-start"></div>
        <div class="points-ring-cap" id="points-ring-cap-end"></div>
        <div class="points-ring-center">
          <div class="value" id="points-value">0</div>
        </div>
      </div>
    </div>
  </div>

  <!-- recent activity -->
  <div class="section">
    <div class="section-heading">
      <svg width="12" height="12" viewBox="0 0 24 24"><path d="M12 7v5l3.5 2.1M21 12a9 9 0 1 1-9-9" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="title">Recent Activity</span>
      <span class="sub">· ประวัติการส่งล่าสุด</span>
    </div>
    <div class="card history-card">
      <div class="activity-tabs">
        <button class="activity-tab is-active" id="tab-pending" data-tab="pending">รอตรวจสอบ</button>
        <button class="activity-tab" id="tab-rejected" data-tab="rejected">ถูกปฏิเสธ</button>
      </div>
      <div class="activity-panel" id="panel-pending">
        <div class="history-list" id="pending-list"></div>
        <button class="history-toggle" id="pending-toggle" hidden>แสดงเพิ่มเติม</button>
      </div>
      <div class="activity-panel" id="panel-rejected" hidden>
        <div class="history-list" id="rejected-list"></div>
        <button class="history-toggle" id="rejected-toggle" hidden>แสดงเพิ่มเติม</button>
      </div>
    </div>
  </div>
</div>

<div class="bottom-nav-wrap">
  <div class="bottom-nav">
    <a href="dashboard.html" class="nav-item active" data-tab="home">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 12 12 4l8 8v7a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">home</span>
    </a>
    <a href="shop.html" class="nav-item" data-tab="shop">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M6 9h12l-1 11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 9zM9 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">shop</span>
    </a>
    <a href="scan.html" class="nav-item nav-item--fab" data-tab="scan" aria-label="Scan">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <a href="rank.html" class="nav-item" data-tab="rank">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 4h8v4a4 4 0 0 1-8 0V4zM5 5H3a3 3 0 0 0 3 5M19 5h2a3 3 0 0 1-3 5M10 14h4v3h2v3H8v-3h2v-3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">rank</span>
    </a>
    <a href="me.html" class="nav-item" data-tab="me">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="label">me</span>
    </a>
  </div>
</div>

<div class="report-fab-wrap">
  <button class="report-fab" id="report-fab" aria-label="แจ้งปัญหา">
    <svg width="16" height="16" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 4.3 2.6 18a1 1 0 0 0 .9 1.5h17a1 1 0 0 0 .9-1.5L13.7 4.3a1.6 1.6 0 0 0-2.8 0z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>แจ้งปัญหา</span>
  </button>
</div>

<div class="modal-overlay" id="report-modal">
  <div class="modal-card">
    <button class="modal-close" id="report-close" aria-label="ปิด">×</button>
    <div class="section-heading lg" style="padding-left:0;margin-bottom:2px;">
      <span class="title">Report a Problem</span>
    </div>
    <div class="sub" style="font-size:11px;color:rgba(26,31,51,0.6);margin-bottom:12px;">แจ้งปัญหาหรือข้อเสนอแนะของคุณ</div>
    <textarea class="report-textarea" id="report-text" placeholder="พิมพ์รายละเอียดปัญหาที่พบ..."></textarea>
    <button class="btn-primary" id="report-submit" style="margin-top:12px;">
      <div class="glow"></div>
      <div class="body"><span class="label">ส่งเรื่อง</span></div>
    </button>
  </div>
</div>

<div class="modal-overlay" id="photo-lightbox">
  <div class="modal-card modal-card--photo">
    <button class="modal-close" id="lightbox-close" aria-label="ปิด">×</button>
    <img id="lightbox-img" class="lightbox-img" alt="รูปหลักฐานที่ถูกปฏิเสธ" src="">
  </div>
</div>

<div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/session-guard.js"></script>
<script src="js/nav-common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
